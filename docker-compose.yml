services:

  auth-service:
    build:
      context: ./services/auth-service
    container_name: attendance-auth
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/attendance_auth
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mongodb


  student-service:
    build:
      context: ./services/student-service
    container_name: attendance-student
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      MONGO_URI: mongodb://mongodb:27017/attendance_student
    depends_on:
      - mongodb


  attendance-service:
    build:
      context: ./services/attendance-service
    container_name: attendance-service
    ports:
      - "5002:5002"
    environment:
      PORT: 5002
      MONGO_URI: mongodb://mongodb:27017/attendance_attendance
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mongodb


  analytics-service:
    build:
      context: ./services/analytics-service
    container_name: attendance-analytics
    ports:
      - "5003:5003"
    environment:
      PORT: 5003
      MONGO_URI: mongodb://mongodb:27017/attendance_analytics
      JWT_SECRET: ${JWT_SECRET}
      ATTENDANCE_SERVICE_URL: http://attendance-service:5002
      STUDENT_SERVICE_URL: http://student-service:5001
    depends_on:
      - mongodb
      - attendance-service
      - student-service


  gateway:
    build:
      context: ./services/gateway
    container_name: attendance-gateway
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - auth-service
      - student-service
      - attendance-service
      - analytics-service


  mongodb:
    image: mongo:7
    container_name: attendance-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db


volumes:
  mongodb_data: